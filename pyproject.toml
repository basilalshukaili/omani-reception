[project]
name = "omani-reception"
version = "0.1.0"
description = "Omani Arabic AI Receptionist — provider-agnostic, business-agnostic, Telegram-first scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Basil Al-Shukaili" },
]
keywords = ["arabic", "omani", "telegram", "ai", "receptionist", "rag"]

# P0 baseline deps. Later phases append (see CHANGELOG / phase reports).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "click>=8.1",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
reception = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["businesses/", "docs/", "infra/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in arg defaults (FastAPI/Click idiom)
]

[tool.ruff.format]
quote-style = "double"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = false  # gradually tighten in later phases
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true  # for libs without stubs
# click decorators (and similar 3rd-party untyped decorators) would otherwise
# make every CLI command "untyped" — same idiom as ruff's B008 ignore.
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = "engine.config.*"
strict = true  # stricter on the config layer

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: fast unit tests with no external deps",
    "integration: tests that hit a real Postgres/Redis",
    "dialect: golden Omani conversation tests",
    "e2e: end-to-end tests through a real channel adapter",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["engine"]
omit = ["*/__init__.py", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
